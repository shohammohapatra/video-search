[project]
name = "video-search-backend"
version = "0.1.0"
description = "Video-grounded multimodal search and retrieval backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "celery>=5.3.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "openai>=1.40.0",
  "opencv-python-headless>=4.9.0",
  "pgvector>=0.2.5",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.29.0",
  "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
